<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamada Poker Timer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background-color: #000000;
            position: relative;
            z-index: 2;
        }

        .background-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 50% 50%, #111 0%, #000 100%);
            opacity: 0.5;
            z-index: 1;
        }

        .timer-display {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32vw;
            font-weight: 800;
            color: #00ff00;
            text-shadow: 0 0 30px rgba(0, 255, 0, 0.4);
            font-variant-numeric: tabular-nums;
            transition: all 0.3s ease;
        }

        .timer-alert {
            color: #ff0000 !important;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.6) !important;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(1.02); opacity: 0.8; }
        }

        .controls {
            display: flex;
            justify-content: space-around;
            padding: 25px 15px;
            background-color: rgba(10, 10, 10, 0.95);
            border-top: 2px solid #222;
            z-index: 3;
            backdrop-filter: blur(10px);
        }

        .btn {
            padding: 18px 30px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-pre { background: #f59e0b; }
        .btn-post { background: #3b82f6; }
        .btn-stop { background: #ef4444; }
        .btn-addtime { background: #8b5cf6; }
        .btn-pause-play { background: #10b981; }

        .btn:hover:not(:disabled) {
            filter: brightness(1.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .btn:active:not(:disabled) { transform: translateY(0); }

        .btn:disabled {
            background: #222;
            color: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .status {
            text-align: center;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            background-color: rgba(15, 15, 15, 0.9);
            border-bottom: 1px solid #222;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .controls { flex-wrap: wrap; gap: 10px; }
            .btn { min-width: 45%; padding: 15px 10px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="background-pattern"></div>
    <div class="container">
        <div class="status" id="status">Hazır</div>
        <div class="timer-display" id="timer">00:15</div>
        <div class="controls">
            <button class="btn btn-pre" id="preBtn"><i class="fas fa-history"></i> PRE (15s)</button>
            <button class="btn btn-post" id="postBtn"><i class="fas fa-play"></i> POST (30s)</button>
            <button class="btn btn-stop" id="stopBtn"><i class="fas fa-stop"></i> DURDUR</button>
            <button class="btn btn-addtime" id="addtimeBtn"><i class="fas fa-plus"></i> SÜRE EKLE</button>
            <button class="btn btn-pause-play" id="pausePlayBtn"><i class="fas fa-play"></i> BAŞLAT</button>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE (SINGLETON PATTERN) ---
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep(freq = 800, dur = 0.15, vol = 0.2) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }

        // --- TIMER LOGIC ---
        let timerInterval = null;
        let timeLeft = 15;
        let isPaused = false;

        const display = document.getElementById('timer');
        const status = document.getElementById('status');
        const pauseBtn = document.getElementById('pausePlayBtn');

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            display.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 5 && timeLeft > 0) {
                display.classList.add('timer-alert');
                playBeep(900, 0.1);
            } else if (timeLeft > 5) {
                display.classList.remove('timer-alert');
            }
        }

        function start(seconds, label) {
            initAudio();
            clearInterval(timerInterval);
            timeLeft = seconds;
            isPaused = false;
            status.textContent = label;
            pauseBtn.innerHTML = '<i class="fas fa-pause"></i> DURAKLAT';
            pauseBtn.disabled = false;
            updateDisplay();
            
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        finish();
                    }
                }
            }, 1000);
        }

        function finish() {
            clearInterval(timerInterval);
            timerInterval = null;
            display.textContent = "00:00";
            status.textContent = "Süre Doldu!";
            display.classList.add('timer-alert');
            pauseBtn.innerHTML = '<i class="fas fa-play"></i> BAŞLAT';
            pauseBtn.disabled = false;
            // Continuous beep for 2 seconds
            playBeep(440, 2.0, 0.3);
        }

        document.getElementById('preBtn').onclick = () => {
            start(15, "PRE - 15 saniye geri sayım başladı");
        };
        
        document.getElementById('postBtn').onclick = () => {
            start(30, "POST - 30 saniye geri sayım başladı");
        };
        
        document.getElementById('stopBtn').onclick = () => {
            clearInterval(timerInterval);
            timerInterval = null;
            timeLeft = 15;
            isPaused = false;
            updateDisplay();
            status.textContent = "Hazır";
            pauseBtn.innerHTML = '<i class="fas fa-play"></i> BAŞLAT';
            pauseBtn.disabled = false;
        };

        document.getElementById('addtimeBtn').onclick = () => {
            if (timerInterval) {
                timeLeft += 30;
                updateDisplay();
                status.textContent = `30 saniye eklendi - Kalan süre: ${timeLeft}s`;
                
                // Reset alarm state if time goes back above 5s
                if (timeLeft > 5) {
                    display.classList.remove('timer-alert');
                }
                
                // Double beep for confirmation
                playBeep(1200, 0.1);
                setTimeout(() => playBeep(1200, 0.1), 150);
            } else {
                status.textContent = "Lütfen önce bir geri sayım başlatın";
            }
        };

        pauseBtn.onclick = () => {
            if (!timerInterval) {
                // If clicked while idle, start default 15s PRE timer
                start(15, "PRE - 15 saniye geri sayım başladı");
            } else {
                // Toggle pause state
                isPaused = !isPaused;
                pauseBtn.innerHTML = isPaused ? '<i class="fas fa-play"></i> DEVAM ET' : '<i class="fas fa-pause"></i> DURAKLAT';
                status.textContent = isPaused ? "Duraklatıldı" : "Devam Ediyor";
            }
        };

        // Fullscreen & Audio Activation on first click
        document.body.onclick = () => {
            initAudio();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        };
    </script>
</body>
</html>

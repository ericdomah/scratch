project:
  name: electricity_theft_detection
  version: '1.0.0'
  seed: 42
  device: auto  # auto, cuda, cpu

data:
  path: data/data.csv
  target_column: FLAG
  test_size: 0.15
  val_size: 0.15
  stratify: true
  random_state: 42
  cache_processed: true
  cache_path: data/processed_cache.pkl

preprocessing:
  missing_value_strategy: interpolate  # interpolate, mean, median, drop
  outlier_method: iqr  # iqr, zscore, isolation_forest
  outlier_threshold: 3.0
  scaler: standard  # standard, robust, minmax
  remove_duplicates: true
  min_valid_ratio: 0.5

feature_engineering:
  statistical_features: true
  timeseries_features: true
  frequency_features: true
  rolling_windows: [7, 14, 30]
  fft_top_k: 10

imbalance:
  method: weighted_loss  # weighted_loss, smote, adasyn, oversample, undersample, focal_loss, none
  focal_alpha: 0.25
  focal_gamma: 2.0
  smote_k_neighbors: 5
  random_state: 42

training:
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  early_stopping_patience: 15
  checkpoint_dir: outputs/models/checkpoints
  use_amp: true
  optimizer: adamw  # adam, adamw, sgd, ranger
  scheduler: cosine  # cosine, onecycle, plateau
  num_workers: 4
  pin_memory: true
  log_interval: 10
  use_tensorboard: true
  use_wandb: false
  wandb_project: electricity-theft

hyperparameter_tuning:
  enabled: false
  n_trials: 100
  timeout: 3600
  direction: maximize
  metric: f1
  study_name: theft_detection_study
  storage: sqlite:///outputs/optuna.db

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc
    - pr_auc
    - mcc
    - cohen_kappa
    - balanced_accuracy
  threshold: 0.5
  save_plots: true
  plot_dir: outputs/plots
  report_dir: outputs/reports

explainability:
  enabled: true
  methods:
    - shap
    - permutation_importance
    - feature_importance
  shap_background_samples: 100
  shap_explanation_samples: 50
  attention_visualization: true
  save_explanations: true

logging:
  level: INFO
  log_file: outputs/logs/experiment.log
  console: true

baseline:
  logistic_regression:
    C: 1.0
    max_iter: 5000
    class_weight: balanced
    solver: lbfgs
    random_state: 42
  decision_tree:
    max_depth: 10
    min_samples_split: 20
    class_weight: balanced
    random_state: 42
  random_forest:
    n_estimators: 300
    max_depth: 15
    min_samples_split: 10
    class_weight: balanced
    n_jobs: -1
    random_state: 42
  extra_trees:
    n_estimators: 300
    max_depth: 15
    class_weight: balanced
    n_jobs: -1
    random_state: 42
  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    objective: binary:logistic
    eval_metric: aucpr
    tree_method: hist
    random_state: 42
  lightgbm:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    class_weight: balanced
    random_state: 42
    n_jobs: -1
  catboost:
    iterations: 500
    depth: 6
    learning_rate: 0.05
    random_seed: 42
    verbose: 0
  svm:
    C: 1.0
    loss: squared_hinge
    dual: false
    class_weight: balanced
    random_state: 42

deep_learning:
  input_dim: null  # Set dynamically
  seq_len: null    # Set dynamically
  cnn:
    channels: [64, 128, 256]
    kernel_sizes: [3, 3, 3]
    dropout: 0.3
    batch_norm: true
  lstm:
    hidden_dim: 128
    num_layers: 2
    dropout: 0.3
    bidirectional: false
  gru:
    hidden_dim: 128
    num_layers: 2
    dropout: 0.3
    bidirectional: false
  bilstm:
    hidden_dim: 128
    num_layers: 2
    dropout: 0.3
    bidirectional: true
  cnn_lstm:
    cnn_channels: [64, 128]
    kernel_size: 3
    lstm_hidden: 128
    lstm_layers: 2
    dropout: 0.3
  cnn_gru:
    cnn_channels: [64, 128]
    kernel_size: 3
    gru_hidden: 128
    gru_layers: 2
    dropout: 0.3
  transformer:
    d_model: 128
    nhead: 8
    num_encoder_layers: 4
    dim_feedforward: 512
    dropout: 0.1
    max_seq_len: 1000
  tcn:
    num_channels: [64, 128, 256]
    kernel_size: 3
    dropout: 0.2
  autoencoder:
    encoder_dims: [256, 128, 64]
    latent_dim: 32
    dropout: 0.2
    threshold_percentile: 95

ensemble:
  xgb_cnn_lstm:
    xgb_weight: 0.4
    dl_weight: 0.6
  xgb_transformer:
    xgb_weight: 0.4
    dl_weight: 0.6
  stacking:
    meta_learner: logistic_regression
    cv_folds: 5
  soft_voting:
    weights: null  # Equal weights if null
  weighted:
    weights: null  # Learned automatically

feature_selection:
  methods: ["mutual_info", "select_k_best", "rfe", "xgboost"]
  k_features: [20, 50, 100, "all"]

optuna_tuning:
  n_trials: 100
  metric: f1
  direction: maximize

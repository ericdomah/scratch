optuna_search_space:
  learning_rate:
    type: float
    low: 1.0e-5
    high: 1.0e-2
    log: true
  batch_size:
    type: categorical
    choices: [64, 128, 256, 512]
  hidden_dim:
    type: categorical
    choices: [64, 128, 256, 512]
  num_layers:
    type: int
    low: 1
    high: 4
  dropout:
    type: float
    low: 0.1
    high: 0.5
  weight_decay:
    type: float
    low: 1.0e-5
    high: 1.0e-2
    log: true
  optimizer:
    type: categorical
    choices: [adam, adamw, sgd]
  scheduler:
    type: categorical
    choices: [cosine, onecycle, plateau]

resume_training:
  enabled: false
  checkpoint_path: null

multi_gpu:
  enabled: false
  device_ids: [0, 1]
  backend: nccl

a100_optimizations:
  allow_tf32: true
  cudnn_benchmark: true
  compile_model: false
  gradient_checkpointing: false
